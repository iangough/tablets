<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablets SOS</title>
<link rel="manifest" href="manifest-sos.webmanifest">
<link rel="apple-touch-icon" href="icon-sos-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tablets SOS">
<meta name="theme-color" content="#b3261e">

<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mute:#5d6b79;--line:#dde3e9;--acc:#2a6fdb;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;--okbg:#e4f6ec;--warnbg:#fff3d6;--badbg:#fde6e6}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#19212a;--ink:#e8eef4;--mute:#9aa9b8;--line:#2a3541;--acc:#6aa2ff;--ok:#4cc58a;--warn:#f0b340;--bad:#ff7a7a;--okbg:#14301f;--warnbg:#3a2f12;--badbg:#3b1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stp{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);color:#fff;font:700 44px/1 system-ui;touch-action:manipulation;user-select:none}
.stv{min-width:120px;text-align:center;font-size:54px;font-weight:800;line-height:1.1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;font:600 14px system-ui}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
body.sosmode{padding-bottom:24px}
.sosbar{background:#b3261e;color:#fff;font:800 20px system-ui;letter-spacing:.06em;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;text-align:center}
.sospad{padding:12px 16px}
.sosname{font-size:30px;font-weight:800;line-height:1.15}
.sosage{color:var(--mute);margin-bottom:8px}
.sosrow{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.sosrow.red{border-color:#b3261e;background:var(--badbg)}
.soslab{font:700 12px system-ui;letter-spacing:.08em;color:var(--mute)}
.sosrow.red .soslab{color:var(--bad)}
.sosval{font-size:18px;font-weight:600;margin-top:2px}
.soscall{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1b7f4b;color:#fff;border-radius:12px;padding:14px 16px;margin:8px 0;text-decoration:none;font-size:18px}
.sosmeds{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sosmed{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sosmed.key{border-color:#b3261e}
.sosmed span{color:var(--mute);font-size:14px}
.sosnote{color:var(--mute);font-size:13px;margin-top:6px}
.soslink{color:var(--acc);font-weight:600}
.sospreview{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px;background:var(--bg)}
.swtog{display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:500}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 14px system-ui;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
#lock[hidden]{display:none}
.lockbox{width:min(320px,86vw);text-align:center}
.lockbox input{text-align:center;font-size:24px;letter-spacing:.3em}
#syncbar{margin-top:6px;background:var(--warnbg);color:var(--warn);padding:7px 12px;border-radius:10px;font-weight:650;font-size:13px}
#banner{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;font-weight:600;color:#fff;background:var(--ok);transform:translateY(-120%);transition:transform .2s}
#banner.show{transform:none}
#banner.err{background:var(--bad)}
main{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:650}
.big{font-size:20px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}
.alert{border-left:5px solid var(--warn);background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert.bad{border-left-color:var(--bad)}.alert.info{border-left-color:var(--acc)}
.alert b{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px 12px;font:600 12px system-ui}
nav button.on{color:var(--acc)}
nav .ic{display:block;font-size:20px}
nav .dot{position:absolute;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;margin-left:4px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,select,textarea,button.btn{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.btn{background:var(--acc);color:#fff;border:0;font-weight:650;margin-top:12px}
button.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.btn.sm{width:auto;padding:6px 12px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
.sheet.show{display:block}
.sheet>div{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px}
h2{font-size:17px;margin:18px 0 4px}
.ev{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.ev button{border:0;background:none;color:var(--bad);font-weight:700}
a.lnk{color:var(--acc);font-weight:600}
</style>
</head>
<body>
<div id="banner"></div>
<header><h1>Tablets</h1><div class="sub" id="sub"></div><div id="chips"></div><div id="syncbar" hidden></div></header><div id="lock" hidden></div>
<main id="main"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<script>window.__SOS=1;
'use strict';
const BUILD='2026-11-23e',APP_VER='1.5.3',APP_DATE='23 November 2026';
const KEY='tablets.v1';
const DAY=864e5;

/* ---------- starting data (Ian's counts, 22 Nov 2026 21:25) ---------- */
/*SEED_BEGIN*/
const SEED={meta:{items:0,settings:0,trips:0},tomb:{},receipts:[],
  settings:{lead:5,gap:14,margin:2,amTime:'08:00',pmTime:'21:30',buyLow:45,preTripDays:14,pharmacies:[]},
  items:[],baselines:{},baseAt:'NOW',events:[],trips:[],orders:[],seq:1};
/*SEED_END*/

/* ---------- state: several people (profiles) on one device ---------- */
const hex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PKEY='tablets.profiles.v2';
const stateKey=id=>'tablets.p.'+id;
const SOS_MODE=!!window.__SOS||location.hash==='#sos';
const EMPTY=(()=>{const e=JSON.parse(JSON.stringify(SEED));Object.assign(e,{items:[],baselines:{},events:[],trips:[],orders:[],receipts:[],tomb:{},meta:{items:0,settings:0,trips:0,sos:0},baseAt:'NOW'});delete e.profileName;return e})();
let PR=(()=>{try{return JSON.parse(localStorage.getItem(PKEY))}catch(e){return null}})();
const states={};
function psave(){try{localStorage.setItem(PKEY,JSON.stringify(PR))}catch(e){}}
function profile(id){return PR.list.find(p=>p.id===id)}
function activeP(){return PR.active?profile(PR.active):null}
function persistState(S,id){try{localStorage.setItem(stateKey(id),JSON.stringify(S))}catch(e){if(!window.__DEMO)banner('Could not save: '+e,true)}}
if(!PR||!PR.list){
  PR={list:[],active:null,device:null,token:null,lock:false,sosPin:false,showOthers:true,sms:false,cal:null,calDone:{}};
  let legacy=null,old={};
  try{legacy=localStorage.getItem('tablets.v1');old=JSON.parse(localStorage.getItem('tablets.sync.v1'))||{}}catch(e){}
  if(legacy||SEED.items.length){
    const id=hex(4);
    PR.list.push({id,name:SEED.profileName||'Me',own:true,space:null,v:0,seed:SEED.items.length>0});
    PR.active=id;
    if(legacy){try{localStorage.setItem(stateKey(id),legacy)}catch(e){}}
  }
  psave();
}
if(!PR.calDone)PR.calDone={};
if(!PR.cal)PR.cal={on:false,account:(SEED.calDefault||{}).account||'',invite:(SEED.calDefault||{}).invite||''};
function fix(o){
  o.rc=o.rc||{};o.receipts=o.receipts||[];o.meta=o.meta||{};for(const k of ['items','settings','trips','sos'])o.meta[k]=o.meta[k]||0;o.tomb=o.tomb||{};
  if(o.baseAt==='NOW'){const d=new Date(),p=n=>String(n).padStart(2,'0');o.baseAt=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T00:00:00'}
  o.settings=o.settings||{};if(o.settings.buyLow===undefined)o.settings.buyLow=o.settings['diabeto'+'neLow']||45;
  if(!Array.isArray(o.settings.pharmacies))o.settings.pharmacies=[];
  o.sos=o.sos||{};const d={name:'',dob:'',allergies:'',conditions:'',warnings:'',diet:'',contacts:[],gp:{name:'',surgery:'',address:'',phone:''},blood:'',nhs:'',address:'',donor:'',advance:'',notes:'',key:[],updated:'',
    show:{dob:true,meds:true,allergies:true,conditions:true,warnings:true,diet:true,contacts:true,gp:true,pharmacy:true,blood:true,donor:true,advance:true,nhs:false,address:false}};
  for(const k of Object.keys(d))if(o.sos[k]===undefined)o.sos[k]=d[k];
  o.sos.show=Object.assign({},d.show,o.sos.show||{});
  return o}
const isOpen=o=>['requested','approved','part','ready'].includes(o.status);
const SNAPW=new WeakMap();
function snapNow(S){
  const o={};
  o.items=JSON.stringify([S.items,S.baselines,S.baseAt]);o.settings=JSON.stringify(S.settings);o.trips=JSON.stringify(S.trips);o.sos=JSON.stringify(S.sos);
  o.orders={};for(const x of S.orders){const {u,...r}=x;o.orders[x.id]=JSON.stringify(r)}
  o.ids=new Set([...S.events.map(e=>e.id),...S.receipts.map(r=>r.id)]);
  return o;
}
function snapReset(S){SNAPW.set(S,snapNow(S))}
function stamp(S){
  const cur=snapNow(S),prev=SNAPW.get(S),now=Date.now();
  if(prev){
    for(const s of ['items','settings','trips','sos'])if(cur[s]!==prev[s])S.meta[s]=now;
    for(const x of S.orders)if(prev.orders[x.id]!==cur.orders[x.id])x.u=now;
    for(const id of prev.ids)if(!cur.ids.has(id))S.tomb[id]=now;
  }
  SNAPW.set(S,cur);
}
function loadState(id){
  if(states[id])return states[id];
  let s=null;
  try{const r=localStorage.getItem(stateKey(id));if(r)s=JSON.parse(r)}catch(e){}
  if(!s){const p=profile(id);s=JSON.parse(JSON.stringify((p&&p.seed&&!p.space&&SEED.items.length)?SEED:EMPTY))}
  states[id]=fix(s);snapReset(states[id]);
  return states[id];
}
let st=PR.active?loadState(PR.active):fix(JSON.parse(JSON.stringify(EMPTY)));
function save(){
  stamp(st);
  const p=activeP();if(p){p.dirty=true;persistState(st,p.id);psave()}
  if(typeof syncSoon==='function')syncSoon();
}
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function banner(msg,err){const b=document.getElementById('banner');b.textContent=msg;b.className='show'+(err?' err':'');clearTimeout(banner.t);banner.t=setTimeout(()=>b.className='',err?6000:3500)}
/* ---------- date helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const lts=d=>ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const nice=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const niceS=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function slotT(day,slot){const [h,m]=(slot==='am'?st.settings.amTime:st.settings.pmTime).split(':').map(Number);const x=new Date(day);x.setHours(h,m,0,0);return x}

/* ---------- ENGINE ---------- */
function inFV(day,slot){
  const ds=ymd(day);
  for(const t of st.trips){
    if(ds>t.from&&ds<t.to)return true;
    if(ds===t.from&&slot==='pm')return true;
    if(ds===t.to&&slot==='am')return true;
  }
  return false;
}
function isPaused(it,ds){return st.events.some(e=>e.type==='pause'&&(e.item==='all'||e.item===it.id)&&ds>=e.from&&ds<=e.to)}
function isMissed(it,ds,slot){return st.events.some(e=>e.type==='missed'&&(e.item==='all'||e.item===it.id)&&e.date===ds&&(e.slot==='both'||e.slot===slot))}

/* simulate one item. Returns stock at `now` (per place) and the moment it runs out. */
function sim(it,now){
  const t0=new Date(it.from&&it.from>st.baseAt?it.from:st.baseAt);
  const pools={uk:st.baselines[it.id]||0,fv:0};
  const pts=[];
  for(const e of st.events){
    if(e.item!==it.id)continue;
    if(e.type==='recount')pts.push({t:new Date(e.at),e});
    else if(e.type==='delivery'||e.type==='extra'||e.type==='move')pts.push({t:new Date(e.at||(e.date+'T12:00:00')),e});
  }
  for(const p of pts){} // (sorted below with doses)
  let snap=null,runOut=null,short=false,shortNow=false;
  const take=(loc,amt)=>{ // returns true if fully covered
    const other=loc==='uk'?'fv':'uk';
    let need=amt;
    const a=Math.min(pools[loc],need);pools[loc]-=a;need-=a;
    if(need>1e-9){const b=Math.min(pools[other],need);pools[other]-=b;need-=b}
    return need<=1e-9;
  };
  const end=addD(now,900);
  for(let day=sod(t0);day<=end&&!runOut;day=addD(day,1)){
    const ds=ymd(day);
    const els=[];
    for(const p of pts)if(p.t>=day&&p.t<addD(day,1)&&p.t>=t0)els.push({t:p.t,kind:'pt',e:p.e});
    for(const slot of ['am','pm']){
      const amt=it[slot];if(!amt)continue;
      const t=slotT(day,slot);if(t<=t0)continue;
      els.push({t,kind:'dose',slot,amt});
    }
    els.sort((a,b)=>a.t-b.t);
    for(const el of els){
      if(!snap&&el.t>now){snap={uk:pools.uk,fv:pools.fv};shortNow=short}
      if(el.kind==='pt'){
        const e=el.e;
        if(e.type==='recount'){pools[e.loc||'uk']=e.qty;if(pools.uk+pools.fv>1e-9)short=false}
        else if(e.type==='delivery'){pools[e.loc||'uk']+=e.qty;if(pools.uk+pools.fv>1e-9)short=false}
        else if(e.type==='extra'){take(inFV(day,'am')?'fv':'uk',e.qty)}
        else if(e.type==='move'){const from=e.from||'uk',to=from==='uk'?'fv':'uk';const q=Math.min(e.qty,pools[from]);pools[from]-=q;pools[to]+=q}
      }else{
        if(isPaused(it,ds)||isMissed(it,ds,el.slot))continue;
        const ok=take(inFV(day,el.slot)?'fv':'uk',el.amt);
        if(!ok){if(el.t<=now){short=true;continue}runOut=el.t;break}
      }
    }
  }
  if(!snap){snap={uk:pools.uk,fv:pools.fv};shortNow=short}
  const out=shortNow;
  const total=snap.uk+snap.fv;
  const perDay=(it.am||0)+(it.pm||0);
  return {uk:snap.uk,fv:snap.fv,total,runOut,out,perDay,daysLeft:runOut?Math.floor((runOut-now)/DAY):null};
}
function thr(){const s=st.settings;return s.lead+s.gap+s.margin}
function lastOrderDate(it,r){return r.runOut?addD(r.runOut,-thr()):null}

/* ---------- alerts ---------- */
function computeAlerts(now){
  const A=[];const S=st.settings;const T=thr();
  const R={};for(const it of st.items)R[it.id]=sim(it,now);
  for(const it of st.items){
    const r=R[it.id];
    if(it.src==='pa'){
      if(r.out||(r.daysLeft!==null&&r.daysLeft<=T)){
        let msg=r.out?'You have run out.':'About '+r.daysLeft+' days left (runs out '+niceS(r.runOut)+').';
        const open=st.orders.find(o=>o.item===it.id&&isOpen(o));
        if(open)continue;
        const late=it.next&&it.next>ymd(addD(r.runOut||now,-S.lead));
        A.push({lvl:'bad',t:'Order '+it.name+' now',m:msg+(late&&it.next>ymd(now)?' Patient Access will not issue before '+niceS(pd(it.next))+', which is too late: ask the surgery to release it early.':''),item:it.id,sort:r.daysLeft??-1,cal:{kind:'order',name:it.name.replace(/ \(.*/,''),id:it.id}});
      }else if(r.runOut&&it.next&&it.next>ymd(addD(r.runOut,-S.lead))){
        A.push({lvl:'warn',t:it.name+': issue date is after you run out',m:'Runs out '+niceS(r.runOut)+' but the next issue is '+niceS(pd(it.next))+'. You may need the surgery to release it early.',item:it.id,sort:r.daysLeft+500});
      }
    }
    if(it.src==='diab'&&r.daysLeft!==null&&r.daysLeft<=(S.buyLow||45)){
      A.push({lvl:'warn',t:'Buy '+it.name.replace(/ \(.*/,'')+' (bulk deal, up to 5 boxes)',m:'About '+r.daysLeft+' days left. Look for a bulk deal.',item:it.id,sort:r.daysLeft,diab:it.name.replace(/ \(.*/,'')});
    }
    if(it.src==='fv'){
      const trips=st.trips.map(t=>({...t,toD:pd(t.to)})).sort((a,b)=>a.toD-b.toD);
      if(r.runOut){
        const before=trips.filter(t=>t.toD<r.runOut&&t.toD>=sod(now));
        const lastT=before[before.length-1];
        if(!lastT)A.push({lvl:'bad',t:'No trip to 24B before '+it.name+' runs out',m:'Runs out '+niceS(r.runOut)+'. Plan a trip, or ask someone to buy it at Mercadona.',item:it.id,sort:r.daysLeft});
        else{
          const dd=Math.round((lastT.toD-sod(now))/DAY);
          if(dd<=4)A.push({lvl:'bad',t:'Buy '+it.name+' at Mercadona before you leave 24B',m:'You leave '+niceS(lastT.toD)+' and run out '+niceS(r.runOut)+'. This is your last chance before it runs out.',item:it.id,sort:dd-100,cal:{kind:'buy',name:it.name,day:ymd(addD(lastT.toD,-3)),key:'buy:'+it.id+':'+lastT.to}});
          else if(before.length===1&&dd<=30)A.push({lvl:'info',t:it.name+': buy on your trip ending '+niceS(lastT.toD),m:'Last trip before it runs out ('+niceS(r.runOut)+'). You will be reminded 3 to 4 days before you leave.',item:it.id,sort:dd});
        }
      }
    }
  }
  /* before leaving the UK: will prescribed stock still cover you after the trip? */
  for(const t of st.trips){
    const from=pd(t.from),to=pd(t.to);
    const days=Math.round((from-sod(now))/DAY);
    if(days<0||days>S.preTripDays)continue;
    const bad=[];
    for(const it of st.items){
      if(it.src!=='pa')continue;
      const open=st.orders.find(o=>o.item===it.id&&isOpen(o));
      if(open)continue;
      const r=sim(it,to);
      if(r.out||(r.runOut&&Math.floor((r.runOut-to)/DAY)<=S.lead+S.margin))bad.push(it.name.replace(/ \(.*/,''));
    }
    if(bad.length)A.push({lvl:days<=5?'bad':'warn',t:'Before you leave for 24B ('+niceS(from)+')',m:'These would be low or empty when you get back on '+niceS(to)+': '+bad.join(', ')+'. Order and collect them at Day Lewis before you go.',sort:days-1000,cal:{kind:'trip',day:ymd(addD(from,-3)),key:'trip:'+t.from+':'+bad.join(',').length,names:bad}});
  }
  for(const o of st.orders){
    const it=st.items.find(i=>i.id===o.item);if(!it)continue;
    if(o.status==='rejected')A.push({lvl:'bad',t:'Order rejected: '+it.name,m:'Your GP rejected the request made on '+niceS(pd(o.date))+'. Check with the surgery.',item:o.item,sort:-500});
    if(o.status==='part'){const owed=o.qty-(o.recv||0);A.push({lvl:'warn',t:'Still owed: '+it.name,m:'Day Lewis gave '+qtyTxt(it,o.recv||0)+' of '+qtyTxt(it,o.qty)+'. '+qtyTxt(it,owed)+' still owed from the order of '+niceS(pd(o.date))+'.',item:o.item,sort:40});continue}
    if(o.status==='ready'){A.push({lvl:'warn',t:'Ready to collect: '+it.name,m:'The pharmacy says it is ready ('+(o.readyAt?niceS(new Date(o.readyAt)):'today')+'). Collect it, then tap Receive.',item:o.item,sort:30});continue}
    if(o.status==='approved'||o.status==='requested')A.push({lvl:'info',t:(o.status==='approved'?'Approved: ':'Requested: ')+it.name,m:'Expected about '+niceS(pd(o.expected))+' (collect at Day Lewis, Andover).',item:o.item,sort:50});
  }
  A.sort((a,b)=>a.sort-b.sort);
  return {A,R};
}

function efSave(){
  efRead();const E=EF;const name=(E.name||'').trim();
  if(!name)return banner('Type the tablet name',true);
  const num=x=>{const v=parseFloat(x);return isNaN(v)?0:v};
  let am=num(E.am),pm=num(E.pm);
  if(E.unit==='box'){const d=num(E.days)||30;am=pm=1/(2*d)}
  else if(!am&&!pm)return banner('Enter how many you take in the morning or evening',true);
  const pack=num(E.pack)||1;
  let it=E.id?st.items.find(i=>i.id===E.id):null;
  if(!it){
    let id=slug(name),n=2;while(st.items.some(i=>i.id===id))id=slug(name)+(n++);
    it={id,from:lts(new Date())};st.items.push(it);st.baselines[id]=0;
    if(num(E.start)>0)st.events.push({id:uid(),type:'recount',item:id,loc:'uk',qty:num(E.start),at:lts(new Date())});
  }
  Object.assign(it,{name,unit:E.unit,am,pm,pack,src:E.src,issue:num(E.issue),next:E.next||'',why:E.why||''});
  save();closeSheet();banner('Saved: '+name);render();
}

let holdT=null,holdI=null,holdN=0;
function rcBump(id,n){const cur=st.rc[id]||0;st.rc[id]=Math.max(0,Math.round((cur+n)*1000)/1000);const e=document.getElementById('stv');if(e)e.textContent=(Math.round(st.rc[id]*10)/10)}

function rcClear(){st.rc={};save();banner('Cleared');rcIdx=0;render(true)}
function saveReceipt(){
  const L=recvList();const lines=[];const rid=uid();const today=ymd(new Date());const msgs=[];
  for(const it of L){
    const q=st.rc[it.id]||0;if(q<=0)continue;
    st.events.push({id:uid(),type:'delivery',item:it.id,date:today,at:lts(new Date()),qty:q,loc:'uk',rid});
    const o=openFor(it.id);let oid=null,prevStatus=null;
    if(o){oid=o.id;prevStatus=o.status;o.recv=(o.recv||0)+q;if(o.recv>=o.qty-1e-6){o.status='collected';o.done=today;msgs.push(it.name.replace(/ \(.*/,'')+' complete')}else{o.status='part';msgs.push(it.name.replace(/ \(.*/,'')+' owed '+Math.round((o.qty-o.recv)*10)/10)}}
    lines.push({item:it.id,qty:q,order:oid,prev:prevStatus});
  }
  if(!lines.length)return banner('Nothing entered',true);
  st.receipts.push({id:rid,date:today,lines});st.rc={};rcIdx=0;save();
  banner('Saved '+lines.length+' items into stock. '+msgs.join(' · '));render(true);
}
function undoReceipt(rid){
  const r=st.receipts.find(x=>x.id===rid);if(!r)return;
  st.events=st.events.filter(e=>e.rid!==rid);
  for(const l of r.lines){const o=st.orders.find(x=>x.id===l.order);if(o){o.recv=Math.max(0,(o.recv||0)-l.qty);o.status=o.recv>0?'part':(l.prev&&l.prev!=='part'?l.prev:'requested');delete o.done}}
  st.receipts=st.receipts.filter(x=>x.id!==rid);save();banner('Receipt undone');render(true);
}

/* ---------- CSV import / export ---------- */
const CSVCOLS=['name','unit','morning','evening','box_size','source','stock_now','stock_24b','order_qty','next_issue','days_per_box','note'];
const SRC={prescription:'pa','supplement-uk':'diab','supplement-spain':'fv'};
const SRCR={pa:'prescription',diab:'supplement-uk',fv:'supplement-spain'};
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows;
}
const normName=s=>s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9.]+/g,' ').trim();
const slug=s=>normName(s).replace(/[^a-z0-9]+/g,'')||('item'+Date.now());
function csvFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>importCSV(String(fr.result));fr.onerror=()=>banner('Could not read that file',true);fr.readAsText(f)}
function importCSV(text){
  const rows=parseCSV((text||'').replace(/^﻿/,''));
  if(rows.length<2)return banner('CSV needs a header row and at least one tablet',true);
  const H=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
  if(H.indexOf('name')<0)return banner('CSV needs a "name" column',true);
  let upd=0,add=0,cnt=0;const bad=[];
  const now=lts(new Date());
  for(let k=1;k<rows.length;k++){
    const row=rows[k];const g=n=>{const i=H.indexOf(n);return i<0?'':(row[i]||'').trim()};
    const name=g('name');if(!name)continue;
    const num=n=>{const v=g(n);if(v==='')return null;const x=parseFloat(v);return isNaN(x)?NaN:x};
    const vals={morning:num('morning'),evening:num('evening'),box_size:num('box_size'),stock_now:num('stock_now'),stock_24b:num('stock_24b'),order_qty:num('order_qty'),days_per_box:num('days_per_box')};
    if(Object.values(vals).some(x=>Number.isNaN(x))){bad.push(name);continue}
    const srcTxt=g('source').toLowerCase();if(srcTxt&&!SRC[srcTxt]){bad.push(name+' (source)');continue}
    let it=st.items.find(i=>normName(i.name)===normName(name)||i.id===slug(name));
    if(!it){it={id:slug(name),name,unit:g('unit')||'tablet',am:0,pm:0,pack:1,src:'pa',issue:0,next:'',why:''};st.items.push(it);st.baselines[it.id]=0;add++}else upd++;
    if(g('unit'))it.unit=g('unit');
    if(srcTxt)it.src=SRC[srcTxt];
    if(vals.box_size!==null)it.pack=vals.box_size;
    if(it.unit==='box'&&vals.days_per_box){it.am=it.pm=1/(2*vals.days_per_box)}
    else{if(vals.morning!==null)it.am=vals.morning;if(vals.evening!==null)it.pm=vals.evening}
    if(vals.order_qty!==null)it.issue=vals.order_qty;
    if(g('next_issue'))it.next=g('next_issue');
    if(g('note'))it.why=g('note');
    if(vals.stock_now!==null){st.events.push({id:uid(),type:'recount',item:it.id,loc:'uk',qty:vals.stock_now,at:now});cnt++}
    if(vals.stock_24b!==null){st.events.push({id:uid(),type:'recount',item:it.id,loc:'fv',qty:vals.stock_24b,at:now});cnt++}
  }
  save();
  if(bad.length)banner('Skipped (bad numbers): '+bad.join(', ')+'. Others imported.',true);
  else banner('Imported: '+upd+' updated, '+add+' new, '+cnt+' stock counts set');
  render();
}
function exportCSV(){
  const q=s=>/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  const now=new Date();
  const lines=[CSVCOLS.join(',')];
  for(const it of st.items){
    const r=sim(it,now);const box=it.unit==='box';
    const rd=x=>Math.round(x*100)/100;
    lines.push([it.name,it.unit,box?'':it.am,box?'':it.pm,it.pack,SRCR[it.src]||'prescription',rd(r.uk),rd(r.fv),it.issue,it.next,box?rd(1/((it.am||0)+(it.pm||0))):'',it.why].map(v=>q(String(v))).join(','));
  }
  const ta=$('csvt');ta.value=lines.join('\n');ta.select();
  try{navigator.clipboard.writeText(ta.value);banner('CSV copied to clipboard')}catch(e){banner('Select all and copy')}
}

/* ---------- PEOPLE, PINs AND SYNC (Synology; works offline from the last saved copy) ---------- */
const API_DEFAULT='https://myev.cloudgough.synology.me:8443';
const API=(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&new URLSearchParams(location.search).get('api'))||API_DEFAULT;
function ensureIds(){if(!PR.device){PR.device=hex(16);PR.token=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');psave()}}
async function api(path,body,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||9000);
  try{
    const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error(j.error||('http '+r.status));e.http=r.status;e.code=j.error;throw e}
    return j;
  }finally{clearTimeout(t)}
}
const docNow=S=>({items:S.items,baselines:S.baselines,baseAt:S.baseAt,settings:S.settings,trips:S.trips,events:S.events,orders:S.orders,receipts:S.receipts,tomb:S.tomb,meta:S.meta,sos:S.sos});
/* merge a remote document into a state (same result on every device); returns true if anything changed */
function mergeDoc(L,R){
  if(!R||typeof R!=='object')return false;
  const before=JSON.stringify(docNow(L));
  const RM=R.meta||{};
  const pick=(sec,fs)=>{if((RM[sec]||0)>(L.meta[sec]||0)){fs.forEach(f=>{if(R[f]!==undefined)L[f]=R[f]});L.meta[sec]=RM[sec]}};
  pick('items',['items','baselines','baseAt']);pick('settings',['settings']);pick('trips',['trips']);pick('sos',['sos']);
  for(const [k,v] of Object.entries(R.tomb||{}))L.tomb[k]=Math.max(L.tomb[k]||0,v);
  const union=(a,b)=>{const m=new Map();for(const x of [...(a||[]),...(b||[])])if(!m.has(x.id))m.set(x.id,x);return [...m.values()].filter(x=>!L.tomb[x.id])};
  L.events=union(L.events,R.events);L.receipts=union(L.receipts,R.receipts);
  const om=new Map();
  for(const x of [...(L.orders||[]),...(R.orders||[])]){const o=om.get(x.id);if(!o||(x.u||0)>(o.u||0))om.set(x.id,x)}
  L.orders=[...om.values()];
  fix(L);
  return JSON.stringify(docNow(L))!==before;
}
let syncTimer=null;
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(syncAll,1500)}
async function syncAll(){for(const p of PR.list)await syncProfile(p);paintSync()}
function typing(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
async function syncProfile(p){
  if(!p.space||p.busy)return;
  if(navigator.onLine===false){p.state='offline';return}
  p.busy=true;let changed=false;
  try{
    const S=loadState(p.id);
    let guard=0;
    while(guard++<5){
      const wantPush=p.dirty||!p.v;
      const body={device:PR.device,token:PR.token,space:p.space,base:p.v||0};
      if(wantPush)body.doc=docNow(S);
      const r=await api('/v1/tablets/sync',body);
      if(r.same)break;
      if(r.conflict||(!wantPush&&r.doc)){
        if(mergeDoc(S,r.doc)){changed=true;snapReset(S);persistState(S,p.id)}
        p.v=r.v;
        if(r.conflict){p.dirty=true;continue}
        p.dirty=false;break;
      }
      if(r.ok){p.v=r.v;p.dirty=false;break}
      if(r.doc===null&&!wantPush)break;
    }
    p.lastOk=Date.now();p.state='ok';
  }catch(e){
    if(e.http===403||e.code==='not_a_member')p.state='removed';
    else p.state=navigator.onLine===false?'offline':'server';
  }finally{
    p.busy=false;psave();paintSync();
    if(changed&&!typing()&&!document.getElementById('sheet').classList.contains('show'))render(true);
  }
}
function syncText(){
  const p=activeP();if(!p||!p.space)return '';
  return p.state==='ok'&&p.lastOk?'synced '+new Date(p.lastOk).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):p.state==='removed'?'removed':p.busy||!p.state?'syncing…':'saved data';
}

function paintSync(){
  const bar=document.getElementById('syncbar');
  if(bar){
    const ps=PR.list.filter(p=>p.space);
    const bad=ps.map(p=>p.state).filter(s=>s&&s!=='ok');
    const msg=bad.includes('offline')?'No internet connection. Showing the last saved data.':bad.includes('server')?'Synology not reachable. Showing the last saved data.':bad.includes('removed')?'This device was removed from a shared list. Open it again with the PIN.':'';
    bar.textContent=msg;bar.hidden=!msg;
  }
  subLine();
}
/* ----- PINs ----- */
const errTxt=e=>e.code||(e.name==='AbortError'?'no reply from the server (timed out)':e.http?('server error '+e.http):('no connection ('+(e.message||e.name)+')'));
const okPin=p=>/^\d{4}$/.test(p||'');
async function pinHash(pin,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function setLocalPin(p,pin){p.salt=hex(8);p.ph=await pinHash(pin,p.salt)}
const PINERR={pin_in_use:'That PIN is already used by someone else. Choose a different one.',bad_pin:'That PIN is wrong.',too_many_tries:'Too many wrong tries. Wait an hour.',group_full:'That list already has the most devices allowed.',bad_code:'That PIN is wrong.',full:'The service is full.'};
async function makeShared(p,pin){
  ensureIds();
  const r=await api('/v1/tablets/create',{device:PR.device,token:PR.token,name:p.name,pin});
  p.space=r.space;p.v=0;p.dirty=true;p.state='pending';
  await setLocalPin(p,pin);
  const S=loadState(p.id);const n=Date.now();S.meta.items=S.meta.settings=S.meta.trips=S.meta.sos=n;persistState(S,p.id);psave();
  await syncProfile(p);
}
async function welcomeCreate(){
  const name=($('wn').value||'').trim(),pin=($('wp').value||'').trim();
  if(!name)return banner('Type your name',true);
  if(pin&&!okPin(pin))return banner('The PIN must be 4 digits',true);
  const id=hex(4),p={id,name,own:PR.list.length===0};
  try{
    PR.list.push(p);PR.active=id;psave();st=loadState(id);
    if(pin)await makeShared(p,pin);
    banner(pin?'Created and backed up. Remember your PIN.':'Created on this device only. Add a PIN in Settings to back it up.');tab='stock';render();
  }catch(e){
    PR.list=PR.list.filter(x=>x.id!==id);PR.active=PR.list[0]?PR.list[0].id:null;psave();st=PR.active?loadState(PR.active):fix(JSON.parse(JSON.stringify(EMPTY)));
    banner(PINERR[e.code]||('Could not create: '+errTxt(e)),true);render();
  }
}

function pollSms(){
  if(!window.AndroidApp||!AndroidApp.takeSmsEvents)return;
  let ev=[];try{ev=JSON.parse(AndroidApp.takeSmsEvents()||'[]')}catch(e){}
  if(!ev.length)return;
  for(const e of ev){
    let named=[],pharm='';
    for(const p of PR.list){
      const S=loadState(p.id);let ch=false;
      for(const o of S.orders)if(['requested','approved','part'].includes(o.status)){o.status='ready';o.readyAt=e.t;ch=true;const it=S.items.find(i=>i.id===o.item);if(it)named.push(it.name.replace(/ \(.*/,''))}
      const ph=(S.settings.pharmacies||[]).find(x=>x.use&&x.name);if(ph&&!pharm)pharm=[ph.name,ph.town].filter(Boolean).join(', ');
      if(ch){stamp(S);p.dirty=true;persistState(S,p.id)}
    }
    PR.ready=(PR.ready||[]).concat([{t:e.t,sender:e.sender,pharm,named}]).slice(-5);
    calAdd('ready:'+e.t,'Collect tablets: '+(pharm||e.sender),ymd(new Date()),'ready',30,pharm,named.length?('Ready: '+named.join(', ')):'The pharmacy sent a ready text.');
  }
  psave();syncSoon();render(true);
}

    $('main').innerHTML='<div class="sosbar">EMERGENCY INFORMATION</div><div class="sospad"><p>This screen is locked by its owner. Type the PIN.</p><input id="sp" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" onclick="sosUnlock()">Show</button></div>';return;
  }
  $('main').innerHTML=sosHtml(loadState(p.id),p)+'<div class="sospad"><a class="soslink" href="index.html">Open the Tablets app</a></div>';
}
async function sosUnlock(){
  const pin=(document.getElementById('sp').value||'').trim();
  if(await checkAnyPin(pin)){try{sessionStorage.setItem('tablets.sosok','1')}catch(e){}renderSos()}else banner('Wrong PIN',true);
}
function sosPlain(S,p){
  const o=S.sos,sh=o.show||{};const L=[];
  L.push((o.name||p.name)+(sh.dob&&o.dob?' (born '+o.dob+')':''));
  if(sh.allergies&&o.allergies)L.push('ALLERGIES: '+o.allergies.replace(/\n/g,'; '));
  if(sh.warnings&&o.warnings)L.push('IMPORTANT: '+o.warnings.replace(/\n/g,'; '));
  if(sh.conditions&&o.conditions)L.push('CONDITIONS: '+o.conditions.replace(/\n/g,'; '));
  if(sh.meds&&S.items.length)L.push('MEDICINES: '+S.items.map(i=>i.name.replace(/ \(.*/,'')+' ('+doseTxt(i)+')').join('; '));
  if(sh.contacts){const cs=(o.contacts||[]).filter(c=>c.name||c.phone);if(cs.length)L.push('CONTACTS: '+cs.map(c=>c.name+(c.rel?' ('+c.rel+')':'')+' '+c.phone).join('; '))}
  if(sh.blood&&o.blood)L.push('BLOOD TYPE: '+o.blood);
  if(sh.gp){const g=o.gp||{};const gt=[g.name,g.surgery,g.phone].filter(Boolean).join(', ');if(gt)L.push('DOCTOR: '+gt)}
  return L.join('\n');
}
function sosCard(){
  const p=activeP();if(!p)return '';
  return '<div class="card"><h2 style="margin-top:0">Tablets SOS (emergency screen)</h2><div class="mute">A separate icon that shows the key medical information of the owner of this phone, with no PIN unless you turn that on above. Everything is optional and you choose what is shown. Defaults: medicines, allergies, conditions and emergency contacts are shown; NHS number and home address are hidden.</div>'
   +'<button class="btn" onclick="swStart()">Set up what SOS shows</button><button class="btn sec" onclick="sosPreview()">Preview the SOS screen</button>'
   +'<button class="btn sec" onclick="sosCopy()">Copy text for the phone\'s lock-screen Emergency Information</button>'
   +'<div class="mute" style="margin-top:8px">Only the phone\'s own lock-screen information can be read when the phone is locked. On Android: Settings → Safety &amp; emergency → Medical information. On iPhone: Health app → Medical ID. Paste the copied text there.</div></div>';
}
function sosPreview(){
  const p=activeP(),h=sosHtml(st,p);
  document.getElementById('sheetBody').innerHTML='<div class="row"><h2 style="margin:0">SOS preview</h2><button class="btn sm sec" onclick="closeSheet()">Close</button></div><div class="sospreview">'+h+'</div>';
  document.getElementById('sheet').className='sheet show';
}
function sosCopy(){
  const txt=sosPlain(st,activeP());
  document.getElementById('sheetBody').innerHTML='<div class="row"><h2 style="margin:0">For the lock screen</h2><button class="btn sm sec" onclick="closeSheet()">Close</button></div><p class="mute">Copy this and paste it into your phone\'s own emergency information.</p><textarea id="sosc" rows="12">'+esc(txt)+'</textarea><button class="btn" onclick="const t=document.getElementById(\'sosc\');t.select();try{navigator.clipboard.writeText(t.value);banner(\'Copied\')}catch(e){banner(\'Select all and copy\')}">Copy</button>';
  document.getElementById('sheet').className='sheet show';
}
/* ---- wizard ---- */
let SW={step:0};
function sosTouch(){st.sos.updated=ymd(new Date())}
function sosSet(k,v){st.sos[k]=v;sosTouch();save()}
function sosGp(k,v){st.sos.gp[k]=v;sosTouch();save()}
function sosShow(k,on){st.sos.show[k]=on;sosTouch();save()}
function sosContact(i,k,v){while(st.sos.contacts.length<=i)st.sos.contacts.push({name:'',rel:'',phone:''});st.sos.contacts[i][k]=v;sosTouch();save()}
function sosKey(id,on){const k=new Set(st.sos.key||[]);on?k.add(id):k.delete(id);st.sos.key=[...k];sosTouch();save()}
function swStart(){SW.step=0;swDraw()}
function swGo(d){SW.step=Math.max(0,Math.min(SW_STEPS.length-1,SW.step+d));swDraw()}
const SW_STEPS=['intro','who','allergies','conditions','warnings','diet','contacts','doctor','more','key','done'];
function swDraw(){
  const o=st.sos,sh=o.show,step=SW_STEPS[SW.step];
  const tog=(k,label)=>'<label class="swtog"><input type="checkbox" style="width:auto" '+(sh[k]?'checked':'')+' onchange="sosShow(\''+k+'\',this.checked)"> '+(label||'Show this on the SOS screen')+'</label>';
  const ta=(k,ph)=>'<textarea rows="4" placeholder="'+ph+'" onchange="sosSet(\''+k+'\',this.value)">'+esc(o[k])+'</textarea>';
  const why=t=>'<p class="mute">'+t+'</p>';
  let body='';
  if(step==='intro')body='<h3>Tablets SOS</h3>'+why('If an ambulance crew or a doctor picks up your phone, this screen can tell them what they most need to know. Answer as much or as little as you like. You can skip any question, change it later, and choose what is shown.')+why('Only put in what you are comfortable with anyone holding your phone seeing.');
  if(step==='who')body='<h3>Who you are</h3>'+why('Your name, so crews know who the information belongs to. A date of birth helps them find your records.')
    +'<label>Full name</label><input value="'+esc(o.name||activeP().name)+'" onchange="sosSet(\'name\',this.value)"><label>Date of birth</label><input type="date" value="'+esc(o.dob)+'" onchange="sosSet(\'dob\',this.value)">'+tog('dob','Show date of birth');
  if(step==='allergies')body='<h3>Allergies</h3>'+why('Reactions to medicines, food, latex or stings. Crews check this before they give you anything. Write what you react to and what happens.')+ta('allergies','e.g. Penicillin: rash and swelling')+tog('allergies');
  if(step==='conditions')body='<h3>Long-term conditions</h3>'+why('Illnesses you live with change how you are treated: diabetes, heart conditions, asthma, epilepsy, rheumatoid arthritis, coeliac disease and so on. Say the type if it matters (for example type 2 diabetes).')+ta('conditions','one per line')+tog('conditions');
  if(step==='warnings')body='<h3>Important warnings</h3>'+why('Anything that changes emergency care: blood thinners, insulin, a pacemaker or stents, a steroid card, implants, a medical device.')+ta('warnings','e.g. Has heart stents')+tog('warnings');
  if(step==='diet')body='<h3>Diet</h3>'+why('Intolerances or needs that matter in hospital, such as coeliac disease or a nut allergy.')+ta('diet','optional')+tog('diet');
  if(step==='contacts'){
    const cs=o.contacts||[];
    body='<h3>Emergency contacts</h3>'+why('Who should crews call? Put the person most likely to answer first. Their number becomes a tap-to-call button.')
      +[0,1,2].map(i=>{const c=cs[i]||{};return '<div class="card" style="margin:8px 0"><label style="margin-top:0">Name</label><input value="'+esc(c.name||'')+'" onchange="sosContact('+i+',\'name\',this.value)"><div class="grid2"><div><label>Relationship</label><input value="'+esc(c.rel||'')+'" onchange="sosContact('+i+',\'rel\',this.value)"></div><div><label>Phone</label><input value="'+esc(c.phone||'')+'" inputmode="tel" onchange="sosContact('+i+',\'phone\',this.value)"></div></div></div>'}).join('')+tog('contacts');
  }
  if(step==='doctor'){
    const g=o.gp||{};
    body='<h3>Doctor and surgery</h3>'+why('So the hospital can contact your GP for your records. Your pharmacy comes from Settings → Pharmacy.')
      +'<label>Doctor\'s name</label><input value="'+esc(g.name)+'" onchange="sosGp(\'name\',this.value)"><label>Surgery name</label><input value="'+esc(g.surgery)+'" onchange="sosGp(\'surgery\',this.value)"><label>Surgery address</label><input value="'+esc(g.address)+'" onchange="sosGp(\'address\',this.value)"><label>Surgery phone</label><input value="'+esc(g.phone)+'" inputmode="tel" onchange="sosGp(\'phone\',this.value)">'+tog('gp','Show doctor on the SOS screen')+tog('pharmacy','Show my pharmacy');
  }
  if(step==='more')body='<h3>More, all optional</h3>'
    +'<label>Blood type</label>'+why('Only if you are certain, for example from a donor card or blood test. Crews always test it themselves, so a wrong entry is worse than none.')+'<input value="'+esc(o.blood)+'" placeholder="e.g. O positive" onchange="sosSet(\'blood\',this.value)">'+tog('blood')
    +'<label>Organ donor</label><input value="'+esc(o.donor)+'" placeholder="e.g. Yes" onchange="sosSet(\'donor\',this.value)">'+tog('donor')
    +'<label>Advance decisions (for example, do not resuscitate)</label>'+why('Say if you have one and where the paperwork is.')+'<input value="'+esc(o.advance)+'" onchange="sosSet(\'advance\',this.value)">'+tog('advance')
    +'<label>NHS number</label>'+why('Helps hospitals find your records. Off by default because anyone holding the phone could read it.')+'<input value="'+esc(o.nhs)+'" inputmode="numeric" onchange="sosSet(\'nhs\',this.value)">'+tog('nhs')
    +'<label>Home address</label>'+why('Off by default. Turn it on only if you want it visible.')+'<input value="'+esc(o.address)+'" onchange="sosSet(\'address\',this.value)">'+tog('address')
    +'<label>Anything else</label><textarea rows="3" onchange="sosSet(\'notes\',this.value)">'+esc(o.notes)+'</textarea>';
  if(step==='key')body='<h3>Medicines</h3>'+why('Your tablets come from this app and are all shown. Tick the most important ones (insulin, blood thinners, heart tablets) to list them first with a star.')+tog('meds','Show my medicines')
    +(st.items.length?st.items.map(it=>'<label class="swtog"><input type="checkbox" style="width:auto" '+((o.key||[]).includes(it.id)?'checked':'')+' onchange="sosKey(\''+it.id+'\',this.checked)"> '+esc(it.name)+'</label>').join(''):'<p class="mute">No tablets in the list yet.</p>');
  if(step==='done')body='<h3>All set</h3>'+why('This is saved. Check it with “Preview the SOS screen” in Settings, add the Tablets SOS icon to your home screen, and keep it up to date.')+'<button class="btn" onclick="closeSheet();sosPreview()">Preview now</button>';
  const last=SW.step===SW_STEPS.length-1;
  document.getElementById('sheetBody').innerHTML='<div class="row"><span class="mute">Step '+(SW.step+1)+' of '+SW_STEPS.length+'</span><button class="btn sm sec" onclick="closeSheet();render(true)">Close</button></div>'+body
    +'<div class="grid2" style="margin-top:14px"><button class="btn sec" '+(SW.step?'':'disabled')+' onclick="swGo(-1)">◀ Back</button><button class="btn" onclick="'+(last?'closeSheet();render(true)':'swGo(1)')+'">'+(last?'Finish':(['intro','who'].includes(step)?'Next ▶':'Next / skip ▶'))+'</button></div>';
  document.getElementById('sheet').className='sheet show';
}

/* test hook for automated checks */
window.__tablets={mergeDoc,docNow,syncAll,get PR(){return PR},get st(){return st},set st(v){st=v},sim,computeAlerts,thr,SEED,EMPTY,ymd,pd,loadState,fix};
render();
if(needLock())showLock();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('sheet').classList.contains('show'))render()});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
